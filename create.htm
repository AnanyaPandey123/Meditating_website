    <title>create account</title>

<body>
    <div class="hero">    
        <h1>Create your Account</h1>
        <form action="account.php" method="post" >
        
            <p> <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required></p>
        
        
            <p><label for="firstname">First Name:</label>
            <input type="text" id="firstname" 
            name="firstname" placeholder="Enter your first name" required>
            </p>
        
            <p><label for="lastname">Last Name:</label>
            <input type="text" id="lastname" name="lastname" placeholder="Enter your last name"></p>

            <p><label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required></p>
        
            <p><label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required></p>
        
            <p><label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>Select </option>
                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>
                    <option value="OTHER">Other</option>
                </select></p>
        <p>
            <button type="submit">Submit</button>
        </p>
    </form>
